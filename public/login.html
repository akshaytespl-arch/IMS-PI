<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <a class="skip-link" href="#email">Skip to sign-in form</a>
  <main class="auth">
    <div class="auth-card">
      <div class="brand"><span class="logo" id="logo"></span><span id="org">Mentor Sessions</span></div>
      <div class="card">
        <h1>Welcome back</h1>
        <p class="muted">Sign in to book or manage your sessions.</p>
        <div id="notice" class="alert alert-info hidden" role="status"></div>
        <div id="error" class="alert alert-error hidden" role="alert"></div>
        <form id="form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required autofocus>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" required>
              <button type="button" id="toggle" aria-controls="password" aria-pressed="false">Show</button>
            </div>
          </div>
          <button class="btn btn-primary btn-lg btn-block" id="submit" type="submit">Sign in</button>
        </form>
        <p class="small muted mt" id="reg"></p>
        <p class="small muted">Forgot your password? Ask your coordinator to reset it for you.</p>
      </div>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
